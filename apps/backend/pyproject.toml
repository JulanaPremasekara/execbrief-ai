[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "execbrief"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.34,<1",
 "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.14,<2",
 "pandas>=2.2,<3", "python-dotenv>=1,<2", "reportlab>=4,<5",
 "langchain-community>=0.3,<1", "langchain-text-splitters>=0.3,<2",
 "langchain-huggingface>=0.3,<2", "langchain-postgres>=0.0.16,<0.1",
 "sentence-transformers>=3,<6", "pypdf>=5,<7"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

